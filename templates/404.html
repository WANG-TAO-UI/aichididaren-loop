{% extends "base.html" %}
{% block title %}404 · 页面不存在{% endblock %}
{% block content %}
<section class="error-page">
  <span class="error-code">404</span>
  <p class="eyebrow">LOST IN THE LOOP</p>
  <h1>这条路径没有计划。</h1>
  <p class="lead">页面可能已被删除，或者链接写错了。回到计划广场看看，那里总有一些正在发生的进度。</p>
  <div class="error-actions">
    <a class="button" href="{% url 'community:home' %}">返回首页</a>
    <a class="button button-ghost" href="{% url 'community:plan_list' %}">浏览计划广场</a>
  </div>
</section>
{% endblock %}
