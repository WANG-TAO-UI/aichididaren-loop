# StudyLoop on 8081. The existing Hexo blog on 443 / 4000 is untouched.
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    client_max_body_size 8m;

    access_log /var/log/nginx/studyloop.access.log;
    error_log  /var/log/nginx/studyloop.error.log;

    location /static/ {
        alias /opt/studyloop/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /opt/studyloop/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
